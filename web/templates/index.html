<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dog Behavior Monitor</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
header {
  background: #161b22;
  padding: 12px 16px;
  border-bottom: 1px solid #30363d;
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 12px;
}
h1 { font-size: 15px; font-weight: 600; }
#refresh {
  margin-left: auto; flex-shrink: 0;
  background: #21262d; color: #8b949e;
  border: 1px solid #30363d; border-radius: 6px;
  width: 28px; height: 28px; padding: 0;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, color 0.15s, transform 0.3s;
}
#refresh:hover { background: #30363d; color: #c9d1d9; }
#refresh:active { transform: rotate(180deg); }
#refresh svg { display: block; }
#dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #484f58; flex-shrink: 0;
  transition: background 0.3s, box-shadow 0.3s;
}
#dot.live { background: #3fb950; box-shadow: 0 0 6px #3fb950; }
#feed { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.card {
  background: #161b22; border: 1px solid #30363d; border-radius: 8px;
  padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start;
}
.thumb-wrap { position: relative; flex-shrink: 0; cursor: pointer; }
.thumb-wrap:hover .thumb { opacity: 0.8; }
.thumb-more {
  position: absolute; right: 3px; bottom: 3px;
  background: rgba(0,0,0,0.7); color: #fff;
  font-size: 11px; font-weight: 600;
  padding: 1px 6px; border-radius: 9px;
  pointer-events: none;
}
.thumb { width: 96px; height: 54px; object-fit: cover; border-radius: 4px; display: block; transition: opacity 0.15s; }
.no-thumb { width: 96px; height: 54px; border-radius: 4px; flex-shrink: 0; background: #21262d; }
.body { flex: 1; min-width: 0; }
.meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.score { font-size: 22px; font-weight: 700; line-height: 1; }
.low  { color: #3fb950; }
.mid  { color: #d29922; }
.high { color: #f85149; }
.time { font-size: 11px; color: #8b949e; margin-left: auto; }
.summary { font-size: 13px; color: #c9d1d9; font-weight: 500; margin-bottom: 2px; }
.detect { font-size: 11px; color: #6e7681; margin-bottom: 3px; }
.desc {
  font-size: 13px; color: #8b949e; line-height: 1.4;
  overflow: hidden; display: -webkit-box;
  -webkit-line-clamp: 3; -webkit-box-orient: vertical;
}
.empty { text-align: center; color: #484f58; padding: 48px 16px; font-size: 14px; }
#cameras {
  background: #161b22; border-bottom: 1px solid #30363d;
  padding: 5px 16px; display: none; flex-wrap: wrap; row-gap: 4px; column-gap: 12px;
}
#cameras.visible { display: flex; }
.cam { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #8b949e; }
.cam-dot { width: 6px; height: 6px; border-radius: 50%; background: #484f58; flex-shrink: 0; }
.cam-dot.ok   { background: #3fb950; }
.cam-dot.warn { background: #d29922; }
.cam-dot.err  { background: #f85149; }
.cam-age { color: #6e7681; }
#modal {
  display: none; position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.85); align-items: center; justify-content: center;
  padding: 16px;
}
#modal.open { display: flex; }
#modal-content {
  display: flex; flex-wrap: wrap; gap: 10px;
  overflow-x: hidden; overflow-y: auto;
  max-width: 96vw; max-height: 96vh; align-items: center; justify-content: center;
}
#modal-content img { max-width: 92vw; max-height: 88vh; border-radius: 6px; object-fit: contain; }
</style>
</head>
<body>
<header>
  <span>🐕</span>
  <h1>Dog Behavior Monitor</h1>
  <button id="refresh" title="Refresh" aria-label="Refresh">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
      <path d="M21 3v6h-6"/>
    </svg>
  </button>
  <span id="dot"></span>
</header>
<div id="cameras"></div>
<div id="feed"><p class="empty">No results yet</p></div>
<div id="modal"><div id="modal-content"></div></div>
<script>
const feed = document.getElementById('feed');
const dot  = document.getElementById('dot');
const modal = document.getElementById('modal');
const modalContent = document.getElementById('modal-content');
let populated = false;

modal.addEventListener('click', () => modal.classList.remove('open'));
document.addEventListener('keydown', e => { if (e.key === 'Escape') modal.classList.remove('open'); });

function renderModal(thumbs) {
  modalContent.innerHTML = thumbs
    .map(t => `<img src="data:image/jpeg;base64,${t}">`)
    .join('');
}

// Show the low-res thumbnails instantly as placeholders, then swap in the
// full-res ones fetched on demand. Full-res images are never streamed, so the
// live feed stays light over slow links.
async function openModal(id, lowThumbs) {
  modal.dataset.id = String(id);
  renderModal(lowThumbs);
  modal.classList.add('open');
  if (id == null) return;
  try {
    const res = await fetch(`/thumbs/${id}`);
    if (!res.ok) return;
    const data = await res.json();
    // Bail if the user already closed it (or opened a different card).
    if (!modal.classList.contains('open') || modal.dataset.id !== String(id)) return;
    if (data.thumbs && data.thumbs.length) renderModal(data.thumbs);
  } catch (e) { /* keep the low-res fallback */ }
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function scoreClass(s) { return s >= 7 ? 'high' : s >= 4 ? 'mid' : 'low'; }
function fmtTime(t) {
  const d = new Date(t);
  return isNaN(d) ? t : d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'});
}

function fmtCamera(cam) {
  return cam.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function addCard(e) {
  if (!populated) { feed.innerHTML = ''; populated = true; }
  const d = document.createElement('div');
  d.className = 'card';
  const thumbs = e.thumbs && e.thumbs.length ? e.thumbs : (e.thumb ? [e.thumb] : []);
  const more = thumbs.length > 1 ? `<span class="thumb-more">+${thumbs.length - 1}</span>` : '';
  const img = thumbs.length
    ? `<div class="thumb-wrap"><img class="thumb" src="data:image/jpeg;base64,${thumbs[0]}">${more}</div>`
    : `<div class="no-thumb"></div>`;
  const timeStr = e.inference_time != null
    ? `${fmtTime(e.time)} · ${e.inference_time.toFixed(2)}s${e.double_pass ? '*' : ''}`
    : fmtTime(e.time);
  const summary = e.summary
    ? `<p class="summary">${esc(e.summary)}</p>`
    : '';
  const detect = (e.cameras && e.cameras.length && e.detected_by)
    ? `<p class="detect">${e.cameras.map(fmtCamera).join(', ')} ${esc(e.detected_by) === "YOLO" ? "" : "(LLM-detected)"}</p>`
    : '';
  d.innerHTML = `
    ${img}
    <div class="body">
      <div class="meta">
        <span class="score ${scoreClass(e.score)}">${e.score}</span>
        <span class="time">${timeStr}</span>
      </div>
      ${summary}
      ${detect}
      <p class="desc">${esc(e.description)}</p>
    </div>`;
  const wrap = d.querySelector('.thumb-wrap');
  if (wrap) wrap.addEventListener('click', () => openModal(e.id, thumbs));
  feed.prepend(d);
}

function updateCameras(status) {
  const div = document.getElementById('cameras');
  div.className = 'visible';
  div.innerHTML = Object.entries(status)
    .map(([name, info]) => {
      const state = info && info.state ? info.state : 'err';
      const age = info && info.age != null
        ? ` <span class="cam-age">(${Math.round(info.age)}s)</span>`
        : '';
      return `<span class="cam"><span class="cam-dot ${state}"></span>${fmtCamera(name)}${age}</span>`;
    })
    .join('');
}

// The connection is considered live only while messages (including the
// server's periodic heartbeat) keep arriving. If the socket goes stale —
// e.g. after the laptop sleeps or the tab is backgrounded for too long —
// the browser may not fire `onclose`, leaving a dead connection that still
// looks "live". The watchdog below detects that and forces a reconnect.
const STALE_MS = 10000;
let ws = null;
let lastMessageTime = 0;
let reconnectTimer = null;

function setLive(isLive) { dot.className = isLive ? 'live' : ''; }

function scheduleReconnect() {
  if (reconnectTimer) return;
  reconnectTimer = setTimeout(() => { reconnectTimer = null; connect(); }, 3000);
}

function connect() {
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws`);
  ws.onopen  = () => { lastMessageTime = Date.now(); setLive(true); };
  ws.onclose = () => { setLive(false); scheduleReconnect(); };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
  ws.onmessage = ({ data }) => {
    lastMessageTime = Date.now();
    setLive(true);
    const msg = JSON.parse(data);
    if (msg.type === 'ping') return;
    if (msg.type === 'history') { msg.entries.forEach(addCard); return; }
    if (msg.type === 'cameras') { updateCameras(msg.status); return; }
    addCard(msg.entry);
  };
}

// Force a reconnect if the connection has gone quiet.
function checkStale() {
  if (ws && ws.readyState === WebSocket.OPEN && Date.now() - lastMessageTime > STALE_MS) {
    setLive(false);
    ws.close();  // triggers onclose -> reconnect
  }
}
setInterval(checkStale, 5000);

// Re-check the moment the page is shown again after being hidden.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (!ws || ws.readyState === WebSocket.CLOSED || ws.readyState === WebSocket.CLOSING) {
    setLive(false);
    connect();
  } else {
    checkStale();
  }
});

document.getElementById('refresh').addEventListener('click', () => location.reload());

connect();
</script>
</body>
</html>
