<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dog Behavior Monitor</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
header {
  background: #161b22;
  padding: 12px 16px;
  border-bottom: 1px solid #30363d;
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 12px;
}
h1 { font-size: 15px; font-weight: 600; }
#refresh {
  margin-left: auto; flex-shrink: 0;
  background: #21262d; color: #8b949e;
  border: 1px solid #30363d; border-radius: 6px;
  width: 28px; height: 28px; padding: 0;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, color 0.15s, transform 0.3s;
}
#refresh:hover { background: #30363d; color: #c9d1d9; }
#refresh:active { transform: rotate(180deg); }
#refresh svg { display: block; }
#stats-btn {
  flex-shrink: 0;
  background: #21262d; color: #8b949e;
  border: 1px solid #30363d; border-radius: 6px;
  width: 28px; height: 28px; padding: 0;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, color 0.15s;
}
#stats-btn:hover { background: #30363d; color: #c9d1d9; }
#stats-btn.open { background: #30363d; color: #58a6ff; }
#stats-btn svg { display: block; }
#stats {
  display: none; position: fixed; top: 50px; right: 12px; z-index: 20;
  background: #161b22; border: 1px solid #30363d; border-radius: 8px;
  padding: 10px 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  font-size: 12px; color: #c9d1d9; min-width: 200px;
}
#stats.open { display: block; }
.stats-title { font-size: 10px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
.stats-title .unit { text-transform: none; letter-spacing: 0; color: #6e7681; }
#stats table { border-collapse: collapse; }
#stats th, #stats td { padding: 3px 10px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
#stats thead th { color: #8b949e; font-size: 11px; font-weight: 600; padding-bottom: 5px; }
#stats tbody th { text-align: left; padding-left: 0; color: #8b949e; font-weight: 400; }
#stats td { color: #c9d1d9; }
#stats tr.runs th, #stats tr.runs td { color: #6e7681; font-size: 11px; padding-top: 6px; }
.stats-empty { color: #6e7681; }
#dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #484f58; flex-shrink: 0;
  transition: background 0.3s, box-shadow 0.3s;
}
#dot.live { background: #3fb950; box-shadow: 0 0 6px #3fb950; }
#feed { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.card {
  background: #161b22; border: 1px solid #30363d; border-radius: 8px;
  padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start;
}
.thumb-wrap { position: relative; flex-shrink: 0; cursor: pointer; }
.thumb-wrap:hover .thumb { opacity: 0.8; }
.thumb-more {
  position: absolute; right: 3px; bottom: 3px;
  background: rgba(0,0,0,0.7); color: #fff;
  font-size: 11px; font-weight: 600;
  padding: 1px 6px; border-radius: 9px;
  pointer-events: none;
}
.thumb { width: 96px; height: 54px; object-fit: cover; border-radius: 4px; display: block; transition: opacity 0.15s; }
.no-thumb { width: 96px; height: 54px; border-radius: 4px; flex-shrink: 0; background: #21262d; }
.body { flex: 1; min-width: 0; }
.meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.score { font-size: 22px; font-weight: 700; line-height: 1; }
.low  { color: #3fb950; }
.mid  { color: #d29922; }
.high { color: #f85149; }
.time { font-size: 11px; color: #8b949e; margin-left: auto; }
.info-btn {
  flex-shrink: 0; background: none; border: none; padding: 0;
  color: #6e7681; cursor: pointer; font-size: 13px; line-height: 1;
  position: relative; top: 0.75px;
  transition: color 0.15s;
}
.info-btn:hover { color: #c9d1d9; }
.info-btn.open { color: #58a6ff; }
.tokens {
  display: none; margin: 4px 0 2px;
  border: 1px solid #30363d; border-radius: 6px;
  background: #0d1117; padding: 5px 9px;
  grid-template-columns: auto 1fr; gap: 2px 16px;
  font-size: 11px; color: #8b949e; line-height: 1.3;
}
.tokens.open { display: grid; }
.tok-v { color: #c9d1d9; font-variant-numeric: tabular-nums; text-align: right; }
.tok-v .rate { color: #6e7681; }
/* Reasoning-trace toggle, sitting inline at the end of the description
   sentence. Muted grey to match the UI, turning active-blue when open like the
   info button. `display: inline` so it flows as text within the line-clamped
   description rather than disrupting the -webkit-box layout. */
.reason-btn {
  display: inline; background: none; border: none; padding: 0; margin-left: 6px;
  color: #6e7681; cursor: pointer; font-size: 16px; line-height: 1;
  vertical-align: -1px; transition: color 0.15s;
}
.reason-btn:hover { color: #c9d1d9; }
.reason-btn.open { color: #58a6ff; }
.reasoning {
  display: none; margin: 4px 0 2px;
  border: 1px solid #30363d; border-radius: 6px;
  background: #0d1117; padding: 6px 9px;
  font-size: 11px; color: #8b949e; line-height: 1.45;
  white-space: pre-wrap; word-break: break-word;
  max-height: 260px; overflow-y: auto;
}
.reasoning.open { display: block; }
.summary { font-size: 13px; color: #c9d1d9; font-weight: 500; margin-bottom: 2px; }
.detect { font-size: 11px; color: #6e7681; margin-bottom: 3px; }
.desc {
  font-size: 13px; color: #8b949e; line-height: 1.4;
}
.empty { text-align: center; color: #484f58; padding: 48px 16px; font-size: 14px; }
#cameras {
  background: #161b22; border-bottom: 1px solid #30363d;
  padding: 5px 16px; display: none; flex-wrap: wrap; row-gap: 4px; column-gap: 12px;
}
#cameras.visible { display: flex; }
.cam { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #8b949e; }
.cam-dot { width: 6px; height: 6px; border-radius: 50%; background: #484f58; flex-shrink: 0; }
.cam-dot.ok   { background: #3fb950; }
.cam-dot.warn { background: #d29922; }
.cam-dot.err  { background: #f85149; }
.cam-age { color: #6e7681; }
#modal {
  display: none; position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.85); align-items: center; justify-content: center;
  padding: 16px;
}
#modal.open { display: flex; }
#modal-content {
  display: flex; flex-wrap: wrap; gap: 10px;
  overflow-x: hidden; overflow-y: auto;
  max-width: 96vw; max-height: 96vh; align-items: center; justify-content: center;
}
#modal-content img,
#modal-content video { max-width: 92vw; max-height: 88vh; border-radius: 6px; object-fit: contain; }
/* Once the viewport is wide enough, cap each clip to just under half-width so
   two camera clips sit side by side (and a single clip isn't oversized);
   narrower screens keep the full-width sizing above and stack them. */
@media (min-width: 720px) {
  #modal-content img,
  #modal-content video { max-width: 46vw; max-height: 70vh; }
}
.modal-note {
  flex-basis: 100%; text-align: center; margin: 0;
  color: #cbd5e1; font-size: 13px;
}
</style>
</head>
<body>
<header>
  <span>🐕</span>
  <h1>Dog Behavior Monitor</h1>
  <button id="refresh" title="Refresh" aria-label="Refresh">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
      <path d="M21 3v6h-6"/>
    </svg>
  </button>
  <button id="stats-btn" title="Recent speeds" aria-label="Recent speeds">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="20" x2="18" y2="10"/>
      <line x1="12" y1="20" x2="12" y2="4"/>
      <line x1="6" y1="20" x2="6" y2="14"/>
    </svg>
  </button>
  <span id="dot"></span>
</header>
<div id="stats"></div>
<div id="cameras"></div>
<div id="feed"><p class="empty">No results yet</p></div>
<div id="modal"><div id="modal-content"></div></div>
<script>
const feed = document.getElementById('feed');
const dot  = document.getElementById('dot');
const modal = document.getElementById('modal');
const modalContent = document.getElementById('modal-content');
let populated = false;

// The last ~100 runs, keyed by entry id so a reconnect (which replays the
// server's history) updates rows in place instead of double-counting. Averages
// in the stats panel are computed from these on demand.
const RECENT_MAX = 100;
const recentRuns = new Map();
let statsOpen = false;

// Close only when the backdrop itself is clicked; clicks that bubble up from
// the content (e.g. the video's play/pause/scrub controls) must not close it.
modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') modal.classList.remove('open'); });

function renderModal(thumbs, note) {
  const noteHtml = note ? `<p class="modal-note">${note}</p>` : '';
  modalContent.innerHTML = noteHtml + thumbs
    .map(t => `<img src="data:image/jpeg;base64,${t}">`)
    .join('');
}

function renderVideos(urls) {
  modalContent.innerHTML = '';
  for (const url of urls) {
    const video = document.createElement('video');
    video.src = url;
    video.controls = true;
    video.autoplay = true;
    video.loop = true;
    video.muted = true;
    video.playsInline = true;
    modalContent.appendChild(video);
  }
}

// Show the low-res thumbnails instantly as placeholders, then swap in the media
// fetched on demand from a single endpoint: one video clip per camera for recent
// results, or the full-res stills for older ones whose clips were evicted. The
// clip bytes are not streamed live, so the feed stays light over slow links.
async function openModal(id, lowThumbs) {
  modal.dataset.id = String(id);
  renderModal(lowThumbs);
  modal.classList.add('open');
  if (id == null) return;
  try {
    const res = await fetch(`/media/${id}`);
    if (!res.ok) return;
    const data = await res.json();
    // Bail if the user already closed it (or opened a different card).
    if (!modal.classList.contains('open') || modal.dataset.id !== String(id)) return;
    if (data.type === 'video' && data.clips && data.clips.length)
      renderVideos(data.clips);
    else if (data.thumbs && data.thumbs.length)
      renderModal(data.thumbs, 'Video clip no longer available — showing snapshots.');
  } catch (e) { /* keep the low-res fallback */ }
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function scoreClass(s) { return s >= 7 ? 'high' : s >= 4 ? 'mid' : 'low'; }
function fmtTime(t) {
  const d = new Date(t);
  return isNaN(d) ? t : d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'});
}

function fmtCamera(cam) {
  return cam.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

// Detailed token panel shown when the info button is toggled. Prefill and
// Decode each show their phase time plus the tokens/sec rate for that phase:
// prefill processes the input (prompt-eval), decode generates the output. The
// times come from streaming, so decode excludes prefill — dividing output
// by the full inference time would fold prefill in and understate it badly for
// image prompts. Reasoning is generated during decode, so it's already part of
// the output tokens and the decode time; its share is surfaced inline when the
// endpoint reports it.
function renderTokens(e) {
  const inTok = e.input_tokens ?? 0;
  const outTok = e.output_tokens ?? 0;
  const phase = (secs, toks) => secs > 0
    ? `${secs.toFixed(2)}s <span class="rate">(${(toks / secs).toFixed(1)} tok/s)</span>`
    : `${secs.toFixed(2)}s`;
  const rsn = e.reasoning_tokens;
  const outVal = rsn != null
    ? `${outTok.toLocaleString()} <span class="rate">(${rsn.toLocaleString()} reasoning)</span>`
    : outTok.toLocaleString();
  const rows = [
    ['Input tokens', inTok.toLocaleString()],
    ['Output tokens', outVal],
  ];
  if (e.prefill_time != null) rows.push(['Prefill', phase(e.prefill_time, inTok)]);
  if (e.generation_time != null) rows.push(['Decode', phase(e.generation_time, outTok)]);
  return `<div class="tokens">` + rows
    .map(([k, v]) => `<span>${k}</span><span class="tok-v">${v}</span>`)
    .join('') + `</div>`;
}

// Record a run for the rolling averages, evicting the oldest once past the cap.
// Keyed by id, so a replayed history entry refreshes its slot rather than being
// counted twice. Refreshes the stats panel live when it's open.
function trackRun(e) {
  if (e.id == null) return;
  recentRuns.set(String(e.id), e);
  while (recentRuns.size > RECENT_MAX) recentRuns.delete(recentRuns.keys().next().value);
  if (statsOpen) renderStats();
}

// Linear-interpolated percentile of a pre-sorted (ascending) array, matching
// numpy's default: p=50 is the median, p=100 the max.
function pctile(sorted, p) {
  if (!sorted.length) return null;
  if (p <= 0) return sorted[0];
  if (p >= 100) return sorted[sorted.length - 1];
  const idx = (p / 100) * (sorted.length - 1);
  const lo = Math.floor(idx), hi = Math.ceil(idx);
  return lo === hi ? sorted[lo] : sorted[lo] + (sorted[hi] - sorted[lo]) * (idx - lo);
}

// Distribution of one phase's per-run speed (tokens ÷ that phase's time) across
// the tracked runs. Every stat is over the same per-run set so the table is
// internally consistent; runs missing this phase's data are skipped.
function speedStats(runs, tokKey, timeKey) {
  const speeds = runs
    .filter(e => e[timeKey] > 0 && e[tokKey] != null)
    .map(e => e[tokKey] / e[timeKey])
    .sort((a, b) => a - b);
  if (!speeds.length) return null;
  return {
    n: speeds.length,
    avg: speeds.reduce((a, b) => a + b, 0) / speeds.length,
    min: pctile(speeds, 0),
    p5: pctile(speeds, 5),
    p50: pctile(speeds, 50),
    p95: pctile(speeds, 95),
    max: pctile(speeds, 100),
  };
}

function renderStats() {
  const runs = [...recentRuns.values()];
  const el = document.getElementById('stats');
  const pre = speedStats(runs, 'input_tokens', 'prefill_time');
  const gen = speedStats(runs, 'output_tokens', 'generation_time');
  if (!pre && !gen) {
    el.innerHTML = `<div class="stats-title">Recent speeds</div>`
      + `<div class="stats-empty">No token data yet</div>`;
    return;
  }
  const fmt = (s, k) => s == null
    ? '—'
    : s[k].toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const rows = [
    ['Average', 'avg'],
    ['Min', 'min'],
    ['5%ile', 'p5'],
    ['Median', 'p50'],
    ['95%ile', 'p95'],
    ['Max', 'max'],
  ];
  el.innerHTML = `<div class="stats-title">Recent speeds <span class="unit">tok/s</span></div>`
    + `<table><thead><tr><th></th><th>Prefill</th><th>Decode</th></tr></thead><tbody>`
    + rows.map(([label, k]) =>
        `<tr><th>${label}</th><td>${fmt(pre, k)}</td><td>${fmt(gen, k)}</td></tr>`).join('')
    + `<tr class="runs"><th>Runs</th><td>${pre ? pre.n : 0}</td><td>${gen ? gen.n : 0}</td></tr>`
    + `</tbody></table>`;
}

const statsBtn = document.getElementById('stats-btn');
statsBtn.addEventListener('click', e => {
  e.stopPropagation();
  statsOpen = !statsOpen;
  statsBtn.classList.toggle('open', statsOpen);
  document.getElementById('stats').classList.toggle('open', statsOpen);
  if (statsOpen) renderStats();
});
// Dismiss the panel when clicking anywhere outside it (or pressing Escape).
document.addEventListener('click', e => {
  if (!statsOpen) return;
  if (e.target.closest('#stats') || e.target.closest('#stats-btn')) return;
  statsOpen = false;
  statsBtn.classList.remove('open');
  document.getElementById('stats').classList.remove('open');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && statsOpen) {
    statsOpen = false;
    statsBtn.classList.remove('open');
    document.getElementById('stats').classList.remove('open');
  }
});

function addCard(e) {
  trackRun(e);
  if (!populated) { feed.innerHTML = ''; populated = true; }
  const d = document.createElement('div');
  d.className = 'card';
  const thumbs = e.thumbs && e.thumbs.length ? e.thumbs : (e.thumb ? [e.thumb] : []);
  const more = thumbs.length > 1 ? `<span class="thumb-more">+${thumbs.length - 1}</span>` : '';
  const img = thumbs.length
    ? `<div class="thumb-wrap"><img class="thumb" src="data:image/jpeg;base64,${thumbs[0]}">${more}</div>`
    : `<div class="no-thumb"></div>`;
  const timeStr = e.inference_time != null
    ? `${fmtTime(e.time)} · ${e.inference_time.toFixed(2)}s${e.double_pass ? '*' : ''}`
    : fmtTime(e.time);
  const hasTokens = e.input_tokens != null || e.output_tokens != null;
  const infoBtn = hasTokens
    ? `<button class="info-btn" title="Token details" aria-label="Token details">ⓘ</button>`
    : '';
  const tokens = hasTokens ? renderTokens(e) : '';
  const hasReasoning = !!(e.reasoning && e.reasoning.trim());
  const reasonBtn = hasReasoning
    ? `<button class="reason-btn" title="Show reasoning" aria-label="Show reasoning">⤢</button>`
    : '';
  const reasoning = hasReasoning ? `<div class="reasoning">${esc(e.reasoning)}</div>` : '';
  const summary = e.summary
    ? `<p class="summary">${esc(e.summary)}</p>`
    : '';
  const detect = (e.cameras && e.cameras.length && e.detected_by)
    ? `<p class="detect">${e.cameras.map(fmtCamera).join(', ')} ${esc(e.detected_by) === "YOLO" ? "" : "(LLM-detected)"}</p>`
    : '';
  d.innerHTML = `
    ${img}
    <div class="body">
      <div class="meta">
        <span class="score ${scoreClass(e.score)}">${e.score}</span>
        <span class="time">${timeStr}</span>
        ${infoBtn}
      </div>
      ${tokens}
      ${summary}
      ${detect}
      <p class="desc">${esc(e.description)}${reasonBtn}</p>
      ${reasoning}
    </div>`;
  const wrap = d.querySelector('.thumb-wrap');
  if (wrap) wrap.addEventListener('click', () => openModal(e.id, thumbs));
  const btn = d.querySelector('.info-btn');
  if (btn) btn.addEventListener('click', () => {
    btn.classList.toggle('open');
    d.querySelector('.tokens').classList.toggle('open');
  });
  const rbtn = d.querySelector('.reason-btn');
  if (rbtn) rbtn.addEventListener('click', () => {
    rbtn.classList.toggle('open');
    d.querySelector('.reasoning').classList.toggle('open');
  });
  // Pin the scroll position: if the user has scrolled down, prepending a new
  // entry at the top would shove everything they're reading downward. Measure
  // how much taller the page gets and scroll by the same amount so their view
  // stays anchored. When they're already at the top we leave it alone so the
  // newest entry slides into view. (Thumbnails have fixed CSS dimensions, so
  // the card's height is stable at insert time and doesn't jump as images load.)
  const pin = window.scrollY > 4;
  const before = pin ? document.documentElement.scrollHeight : 0;
  feed.prepend(d);
  if (pin) window.scrollBy(0, document.documentElement.scrollHeight - before);
}

function updateCameras(status) {
  const div = document.getElementById('cameras');
  div.className = 'visible';
  div.innerHTML = Object.entries(status)
    .map(([name, info]) => {
      const state = info && info.state ? info.state : 'err';
      const age = info && info.age != null
        ? ` <span class="cam-age">(${Math.round(info.age)}s)</span>`
        : '';
      return `<span class="cam"><span class="cam-dot ${state}"></span>${fmtCamera(name)}${age}</span>`;
    })
    .join('');
}

// The connection is considered live only while messages (including the
// server's periodic heartbeat) keep arriving. If the socket goes stale —
// e.g. after the laptop sleeps or the tab is backgrounded for too long —
// the browser may not fire `onclose`, leaving a dead connection that still
// looks "live". The watchdog below detects that and forces a reconnect.
const STALE_MS = 10000;
let ws = null;
let lastMessageTime = 0;
let reconnectTimer = null;

function setLive(isLive) { dot.className = isLive ? 'live' : ''; }

function scheduleReconnect() {
  if (reconnectTimer) return;
  reconnectTimer = setTimeout(() => { reconnectTimer = null; connect(); }, 3000);
}

function connect() {
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws`);
  ws.onopen  = () => { lastMessageTime = Date.now(); setLive(true); };
  ws.onclose = () => { setLive(false); scheduleReconnect(); };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
  ws.onmessage = ({ data }) => {
    lastMessageTime = Date.now();
    setLive(true);
    const msg = JSON.parse(data);
    if (msg.type === 'ping') return;
    if (msg.type === 'history') {
      // A reconnect replays the full server history; rebuild the rolling window
      // from it so a server restart (which resets entry ids) can't leave stale
      // runs behind. Live entries append to this afterward.
      recentRuns.clear();
      msg.entries.forEach(addCard);
      if (statsOpen) renderStats();
      return;
    }
    if (msg.type === 'cameras') { updateCameras(msg.status); return; }
    addCard(msg.entry);
  };
}

// Force a reconnect if the connection has gone quiet.
function checkStale() {
  if (ws && ws.readyState === WebSocket.OPEN && Date.now() - lastMessageTime > STALE_MS) {
    setLive(false);
    ws.close();  // triggers onclose -> reconnect
  }
}
setInterval(checkStale, 5000);

// Re-check the moment the page is shown again after being hidden.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (!ws || ws.readyState === WebSocket.CLOSED || ws.readyState === WebSocket.CLOSING) {
    setLive(false);
    connect();
  } else {
    checkStale();
  }
});

document.getElementById('refresh').addEventListener('click', () => location.reload());

connect();
</script>
</body>
</html>
